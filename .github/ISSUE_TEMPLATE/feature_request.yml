name: Feature request
description: Suggest an idea or an improvement for Kairos
labels: ["enhancement", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Kairos keeps design decisions in `docs/spec/` (index: [docs/spec/README.md](https://github.com/SKOHscripts/Kairos/blob/main/docs/spec/README.md)); some choices there are deliberate (offline app, no account, no network permission, a single light theme for now), so a quick look can save you time. Ideas that go against one are still welcome: say which decision you would reopen and why.
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I searched the existing issues and this idea is not already there.
          required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you doing when you hit the limit? Describe your situation (work, home, a team…), not the solution.
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Need
      description: What is hard, slow or impossible today, and how often does it come up?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What would you like to be able to do? How would you know it works?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Kairos?
      options:
        - Day view and planning
        - Week or month view
        - Recurring tasks and slots
        - Timer and alerts
        - Statistics
        - Settings
        - Guide and first-task coaching
        - Team space
        - Export, import and sync
        - Appearance and languages
        - Distribution and installation
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds, other apps, or alternatives you considered.
  - type: dropdown
    id: platform
    attributes:
      label: Platform where you need it
      multiple: true
      options:
        - Android
        - Windows
        - Linux
        - macOS
        - Web (browser)
